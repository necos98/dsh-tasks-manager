# dsh-tasks-manager bundle patch: inserts the taskQueue row over the composed profile.
# The row registers the /tasks command, the system-prompt section (policy band,
# order 50, English), the six queue tools, and — through the VOLATILE fields of
# the plugin's exported Config schema — the settings namespace the web client
# reads and writes. Config is validated at plugin load.
#
# SETTINGS NAMESPACE: since DSH 0.1.7-rc.2 the namespace is keyed by this row's
# `id` below ("dsh-tasks-manager"), not by a namespace the plugin registers
# itself, and it is built only from the volatile Config fields (baseBranch,
# workerCanFinish, workerGitMode, workerRules, workerModel). The row id is the
# key preferences are persisted under and must stay in sync with SETTINGS_NS in
# lib/config.js (asserted by test/config.test.js).
#
# order 50 is deliberate: the tasks:policy section (approve/close are USER-ONLY,
# never the model) must sit right after the persona, before every tool
# description. Official placements (TOOL_READ=1100 etc.) sit far below; policy
# first is what keeps triage/worker prompts from reading as ordinary guidance.
#
# PATCH IDS: patch rows target the entry's composed id (options.id —
# "dsh-tasks-manager"), NOT the loader's namespaced runtime id
# ("include:dsh-tasks-manager").

- insert:
    - id: dsh-tasks-manager
      name: dsh-tasks-manager
      config:
        enabled: true
        order: 50
        allowCommand: true
        # Settings namespace (per-user, editable in Settings -> Tasks). These
        # pre-seed the defaults for a fresh install; a saved value wins.
        baseBranch: ""
        workerCanFinish: false
        workerGitMode: branch-automerge
        workerRules: ""
        workerModel: ""
