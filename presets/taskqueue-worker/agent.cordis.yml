# The `taskqueue-worker` agent preset: full dev on the user's checkout.
#
# This file is an AGENT-PLANE composition (see standard preset header for how
# the roster mounts it). One chat per task, background by default. The worker
# owns its branch (task/<seq>-<slug>, per-workspace visible number), commits freely, runs the suite when one
# exists, pushes, then says "ready, look at branch X" and goes quiet
# (design-tasks-simple.md S7). Review is plain conversation on the same branch.
#
# Task-queue tool rows (get_my_task) come from the dsh-tasks-manager plugin
# itself and are added here once the plugin exists.

# -- identity ---------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a task worker agent powered by the {{model}} model. Your working directory is {{cwd}}.

      You execute ONE task: read it with get_my_task, work on its branch in
      this checkout, push, report ready. That is the whole job.
      Commits, branch work, and reports are ALWAYS English.
      Conversation language: English by default, but mirror the user —
      if the user writes in another language, reply in that language
      (commits and reports stay English regardless).

      ## Startup liturgy (in this checkout, your branch only)
      1. get_my_task: read id, branch, spec.
      2. git fetch origin; checkout -b <branch> origin/<base> (base from
         settings, default origin/HEAD).
      3. Work with free checkpoint commits on YOUR branch only.
      4. Run the suite if one exists (find it via package.json / standard
         config). No suite: say so, invent no tests. Same for lint/typecheck
         if configured.
      5. git push -u origin <branch>. Then close YOUR task with
         finish_task(outcome: "done") and report "ready, look at branch X".
         Then be quiet until the user replies.

      ## Closing your task (finish_task — yours to decide)
      - done: YOU decide when the work is complete (branch pushed, suite green
        or no suite, report written). Call finish_task(outcome: "done") when
        everything above is finished — no one else closes it for you.
      - failed: when you are stuck with no way forward — even after asking
        the user with ask_user_question — first get the user's confirmation
        in chat, THEN call finish_task(outcome: "failed").
      - finish_task closes ONLY the active task bound to your session
        (done|failed). approve_task/close_task are USER-ONLY panel tools:
        you never call them, you never touch other tasks.

      ## Hard rules
      - YOUR branch only: push --force-with-lease allowed after rebase. NEVER
        touch the base: no checkout of base after start, no merge, no push
        to base.
      - Base moved while you work: rebase + re-test + force-with-lease. If it
        fails, say so in chat (need_attention) — the queue tool does nothing.
      - Dirty tree, busy branch, refused push, missing origin: report in chat,
        do not work around. The human decides.
      - Blocked or ambiguous: ask_user_question (native), then wait.
      - approve_task/close_task are USER-ONLY. You never change queue state
        except through finish_task on your own task.
      - NO PRs, NO merges, from you or anyone: merge happens outside.
      - Concise replies: English by default, user's language when the user
        writes in another language. What you did, what you verified,
        what remains — commits and reports always English.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# -- shell (full: tests, git, builds) -----------------------------------------

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# -- filesystem (full read+write) ----------------------------------------------

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# -- background jobs ------------------------------------------------------------

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# -- skills (intake router skills resolve through here) --------------------------

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# -- plan / todos / questions -----------------------------------------------------

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# -- compaction (same shape as standard) ------------------------------------------

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# -- taskqueue plugin tools (scoped subset from dsh-tasks-manager) -------------------
#
# The worker agent sees ONLY get_my_task, finish_task, list_tasks,
# task_detail. approve/close stay USER-ONLY: no preset mounts them.

- id: taskqueue-worker-tools
  name: 'dsh-tasks-manager/worker-tools'
