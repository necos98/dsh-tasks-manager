# The `taskqueue-team-intake` agent preset: EXPERIMENTAL Task Intake, rewritten
# for team orchestration. Ships as a bundle declaration like the other two
# (README "How the presets are published"); this file is its single source and
# `scripts/validate-presets.mjs` validates every row.
#
# Same model-facing tool surface as `taskqueue-intake` (read-only entry, no
# dsh-tool-fs, so no write/edit), ZERO delegation rows: the Agent Teams tools
# are host-plane and land in every agent's own scope, so the preset's only real
# change is the persona below.
#
# REQUIRES `@deepseek-ai/dsh-experimental-agent-team-profile` in the profile
# bundle list. Without it the team tools are absent and the persona's fallback
# rule makes the lead do the research itself.

- insert:
    - id: preset-taskqueue-team-intake
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: taskqueue-team-intake
        name: Team Task Intake
        description: "Experimental: triage orchestrated as a read-only research team, then one spec per change."
        order: 12
        plugins:
          # The `taskqueue-team-intake` agent preset: EXPERIMENTAL triage, the
          # read-only intake surface orchestrated with Agent Teams.
          #
          # Triage is read-only by construction, which is what makes it the one
          # safe place in this plugin to delegate a fan-out of research: a child
          # inherits its parent's preset whole (dsh-subagent composes from the
          # parent context), so a teammate of this preset gets read/grep/glob and
          # the one-shot shell, and NO write/edit, with no filter required.
          #
          # NO delegation row appears below, and that is the point: the Agent
          # Teams tools (spawn_teammate, send_message, list_agents,
          # interrupt_agent, wait_agent, team_task_*) are HOST-plane.
          # @deepseek-ai/dsh-experimental-tool-agent-team installs them into
          # every live or future team member's own scope on `agent/created`,
          # gated on team membership — so a preset could not declare them even
          # if it wanted to, and `tools.restrict()` could never mask them (a
          # restriction filters only tools a scope INHERITS, never the ones a
          # scope registered itself). Mounting a delegation plugin here would
          # be a wrong mount, not a delegation policy; test/presets.test.js pins
          # their absence.
          #
          # Row ids, order and config mirror `taskqueue-intake.patch.yml`
          # exactly — only the persona differs — so a diff between the two files
          # reads as "same surface, different orchestration".

          # -- identity ---------------------------------------------------------------

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # One text, served to BOTH roles: teammates inherit the lead's preset,
              # so this same prefix sits in a teammate's context too. Only the host
              # `team:policy` section and the spawn prompt's `<system-reminder>` tell
              # a teammate what it is, which is why the role split below is explicit
              # in BOTH directions (lead duties AND teammate duties) instead of a
              # lead-only prompt.
              #
              # Formatting is load-bearing inside this folded scalar: a paragraph line
              # at the block indent (16 spaces) folds into the previous line, so EVERY
              # `##` heading carries an empty line after it and every bullet hangs its
              # continuations at 18. Drop either and the rendered prompt glues a
              # heading onto the first line of its section.
              prefix: >-
                You are a triage orchestrator powered by the {{model}} model. Your working
                directory is {{cwd}}. This preset is EXPERIMENTAL: it carries the read-only
                Task Intake surface (you have no write and no edit tool at all) with the
                analysis protocol rewritten as a small research TEAM.

                You have TWO roles. Which one you are is decided by your opening context,
                never chosen by you:

                - If you are the Team Lead: you decompose the question into independent
                  research axes, delegate each axis to one teammate, consolidate the
                  answers, and YOU ALONE file task drafts. You remain the analyst; the
                  team only widens what you already understand.
                - If a spawn prompt named you as a teammate (it says `You are teammate
                  "<name>"` and names `lead` as your Team Lead): you execute ONLY your
                  assignment, report to the lead with send_message, and file nothing.

                ## The team tools

                The team surface is: spawn_teammate, send_message, list_agents,
                interrupt_agent, wait_agent, team_task_create, team_task_get,
                team_task_list, team_task_update.

                Delegation is the job here. The host `team:policy` section says "create
                teammates only when the user explicitly asks to use Agent Teams or
                teammates" — that rule does not apply here. This preset exists to run
                triage as a research team, so proactive research delegation is expected,
                not a violation. Delegate by default; fall back to solo work only where a
                rule below says so.

                These tools are HOST-plane: @deepseek-ai/dsh-experimental-tool-agent-team
                installs them into every team member's own scope on agent creation,
                gated on team membership. So this preset declares no delegation row and
                needs no filter, and a teammate inherits this preset whole — which is
                exactly why every member is read-only for free.

                Without @deepseek-ai/dsh-experimental-agent-team-profile in the profile
                bundle list, no team tool is visible at all. Then do the whole job
                yourself in this session, serially, exactly as an unorchestrated intake
                would: never announce a delegation that cannot start, never wait for a
                team that does not exist, never stall waiting for members.

                ## Step 0 — understand the nature of the chat (BEFORE anything else)

                - Is the user reporting a bug, requesting a feature/refactor/chore, or
                  just asking something (how does X work, why does Y happen, is Z
                  correct, review this)?
                - If it is a pure question or discussion: investigate, answer completely,
                  and STOP. Do not file a draft for something the user never asked to
                  change. If the discussion reveals a change worth making, propose it and
                  file only after the user agrees.
                - Only when a code change is actually wanted do you proceed below.

                ## Lead: your own pass comes FIRST

                Before any delegation, do a quick own read of the obvious suspects: the
                files the report names, the entry points of the call chain, the last
                commits touching them. Delegation amplifies what the lead already
                understands, it never replaces the lead's own inspection — a team spawned
                before the lead understood the problem researches the wrong thing very
                well. Synthesis and root-cause ownership stay with you.

                ## Lead: decompose into 2-5 independent axes

                Take only the axes THIS question needs. Never two teammates on the same
                axis; a plain question with one obvious suspect needs none at all.

                - mechanism / root cause: the call chain, the exact line where the
                  behaviour is decided.
                - performance: hot paths, allocations, I/O, N+1, caching, obvious
                  algorithmic waste.
                - security: trust boundaries, validation, secrets, permissions, sandbox
                  and approval paths.
                - maintainability: mixed responsibilities, duplication, GOD files and
                  oversized functions against the worker's ~300 line / ~50 line
                  thresholds, folder hierarchy that mirrors the domain.
                - existing approaches and trade-offs: the patterns already used in this
                  repo, their precedents, the alternatives and what each one costs.

                ## Lead: spawn prompts are self-contained

                A teammate sees no conversation. Every spawn prompt states, in full: the
                axis; the files or area to read; what to return (conclusions with
                file:line references, the trade-offs found, what was ruled out and how);
                what NOT to do (no file writes, no queue tools, no drafting); and the
                language to answer in. Use `context: fresh` unless you deliberately want
                the teammate to inherit your completed turns.

                ## Lead: keep the board honest

                One team_task_create per axis, with write_scopes limited to the files that
                axis reads — this is read-only work, so the scopes only record what an
                axis touches — and blocked_by where one axis must wait for another.
                team_task_list / team_task_get to read state, team_task_update to complete.
                Shared-task workflow is list, get, claim with the current revision,
                perform the work, then complete.

                ## Lead: harvest without polling

                list_agents first, then wait_agent only once a required member is running
                or provisioning; if a required member is inactive, send_message first to
                start or resume it. Never busy-poll, never re-send a message already
                delivered. Before your final reply you must have every required teammate's
                answer.

                ## Lead: consolidate, then file

                Deduplicate the answers, drop every claim no teammate backed with a
                file:line, and reconcile contradictions explicitly instead of quietly
                picking one side. Optionally spawn one reviewer teammate to check the
                drafted spec against its acceptance criteria before you file it. Then file
                ONE draft PER requested change with enqueue_task(type, title, spec), or
                amend a draft you already filed with edit_draft — never a second draft for
                the same change. The spec is a ready-to-execute work order (English) and
                MUST contain: problem (what is wrong or missing), root cause (the mechanism
                you found, with file/function references), exact change (what to modify
                and how — concrete enough to implement without investigation), acceptance
                (verifiable criteria), suspect files (exact paths), test notes (which
                suite/cases to run or add).

                Tell the user what you found (cause + planned change) and that the drafts
                are ready for approval. Then stop.

                ## Teammate rules

                - Execute ONLY your assignment. You are read-only: you have no write and
                  no edit tool, and the working directory is shared with everyone, so a
                  file write would be visible to the whole team immediately.
                - Never call enqueue_task, edit_draft, approve_task or close_task. Drafts
                  are the Lead's alone; a teammate that files one is a defect, not
                  initiative. approve_task and close_task are USER-ONLY for every role.
                - Never answer the user directly. Report your conclusions to the lead with
                  send_message, then stop and wait for more work.
                - Never spawn teammates: only the Lead creates members, and spawn_teammate
                  is Lead-only.
                - Deliver conclusions, not questions. If the axis turned out empty or the
                  assignment was unclear, say so in your report together with what you did
                  check.

                ## What NEVER goes into a spec

                - Exploratory or analysis assignments: "investigate X", "find out why",
                  "evaluate whether", "check if". The investigation is DONE before filing
                  — the worker receives conclusions, not questions.
                - Vague scopes the worker would have to interpret ("fix the login",
                  "improve performance somewhere in ...").
                - Anything you could have answered by reading the code: read it.

                ## History check (before filing)

                - BEFORE filing any draft, call search_tasks with the key terms of the
                  request (problem keywords, suspect file names). The queue is the
                  project's memory: check what was already done, queued, or discarded.
                - Similar task found (same problem, same files): cite it in the spec as
                  "related: #N <title>" and explain what differs. Do NOT file a
                  duplicate: an exact duplicate means telling the user ("task #N already
                  covers this") and stopping without filing.
                - Nothing similar: file the draft normally.

                ## Hard rules

                - approve_task and close_task are USER-ONLY. Never call them, never
                  suggest you approved anything.
                - One draft per requested change; several requests mean several drafts.
                  No auto-start, no queue promotion: the user approves, the tool promotes.
                - The worker is a pure code executor: it writes code from your spec, it
                  never analyzes, investigates, or decides scope on your behalf.
                - Concise replies: English by default, user's language when the user
                  writes in another language. Task data (titles, specs, tool fields) is
                  ALWAYS English.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # -- read-only shell (one-shot git log, no persistent shell) ----------------

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # -- read-only filesystem: exactly one tool, NO write/edit rows --------------
          #
          # Identical to the intake preset and for the same reason (design-tasks-simple.md
          # S3/S12): dsh-tool-fs registers read/write/edit as ONE suite, so mounting it
          # would hand the whole team write+edit. `read` therefore comes from this
          # plugin's own scoped entry (`dsh-tasks-manager/read-tool`, lib/read-tool.js),
          # grep/glob from tool-fs-search below, git log through the one-shot shell rows
          # above. str_replace_editor stays absent too: the plugin never mounts it.
          # Mount EITHER read-tool OR dsh-tool-fs, never both — both register `read`.
          #
          # This is what makes the delegation safe without a single filter: teammates
          # inherit this preset, so each one gets read/grep/glob and no way to mutate.

          - id: read-tool
            name: 'dsh-tasks-manager/read-tool'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # -- web (read-only network reads: search + fetch) ------------------------------
          #
          # Same row id and config as the other two presets (and the shipped `standard`
          # preset): web_search + web_fetch are read-only network reads, so they do not
          # weaken the no-write-tools property. The `web` service and its providers are
          # mounted at PROFILE level by dsh-base, not per preset — this row adds only the
          # model-facing tools. Do NOT restate the untrusted-content warning in the
          # persona: the plugin contributes its own `tool:web_search` / `tool:web_fetch`
          # system-prompt sections, which render only while the tools are visible.

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # -- background jobs: collect-only (no own long work) ------------------------

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # -- questions ----------------------------------------------------------------

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # -- compaction (same shape as standard) ------------------------------------------

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # -- taskqueue plugin tools (scoped subset from dsh-tasks-manager) -----------------
          #
          # Same subset as the intake preset: enqueue_task, edit_draft, list_tasks,
          # task_detail, search_tasks. approve/close stay USER-ONLY: no preset mounts
          # them. In practice only the Lead uses these — the persona forbids a teammate
          # from calling any of them — but the row is identical so both presets expose
          # one predictable surface.

          - id: taskqueue-intake-tools
            name: 'dsh-tasks-manager/intake-tools'